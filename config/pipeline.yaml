# regenerative-harvest-planning/config/pipeline.yaml
# Pipeline parameters for Project 2. Everything parameterised; no magic numbers
# in module code. fi_forest_data/validate.py checks this against a schema in CI:
# a missing or out-of-range parameter fails the build rather than defaulting.
# Values below are TASK 00 decisions (docs/TASK_00_FINDINGS.md), not new.

aoi: aoi_central.yaml   # resolved relative to this config file's directory

module_d1_dtw_derive:
  validation_catchment_bbox_3067: [414920, 6945300, 429010, 6964880]  # SYKE FI1-14.06.161, 148 km2
  reference_product: dtw_2023_cmv2   # TASK 00 decision D3: newer DEM, peatland-improved cost model
  reference_unit: cm                 # 2023 DTW is centimetres (2019 legacy vintage was mm)
  dem_resolution_m: 2
  culvert_burn: true
  pit_removal: carve                 # Lindsay 2016; the reference product uses breaching - expected divergence
  flow_algorithm: dinf               # Tarboton 1997; the reference product uses D8 - expected divergence
  channel_thresholds_ha: [0.5, 1.0, 2.0, 4.0, 10.0]   # 2023 CMv2 set (adds 2 ha vs the 2019 set)

module_d2_dtw_extend:
  weather_term:
    enabled: true
    fmi_station_id: 101537            # Viitasaari Haapaniemi, daily record from 1970
    antecedent_precip_days: [7, 14, 30]
    snowmelt_detection: snow_depth_delta
    interpolate_between_thresholds: true
  soil_term:
    enabled: true
    source: msnfi_soil_main_type      # MS-NFI paatyyppi: peat vs mineral
    peat_bearing_penalty: 0.5         # placeholder - calibrate against korjuukelpoisuus at D2 build time

module_d3_rootrot:
  mandatory_period: {start: "05-01", end: "11-30"}
  mineral_soil_conifer_volume_share_min: 0.50
  peat_soil_spruce_volume_share_min: 0.50
  exemption_min_temp_c: -10.0
  exemption_lookback_days: 21
  spore_dispersal_mean_temp_c: 5.0
  urea_watercourse_setback_m: 10

module_e_plus:
  buffer_widths_m: [10, 20, 30]
  habitat_setback_widths_m: [10, 20, 30]   # Forest Act §10 habitats: no single legal number - swept at the Plus waterway-buffer widths
  dtw_wet_threshold_m: 1.0            # Hilli & Mykra et al. 2022: 0.8-1.2 m band, upland-species boundary
  retention_trees_per_ha: 30
  retention_min_dbh_cm: 15
  deadwood_trees_per_ha: 20           # Plus target, trees/ha - reported vs an aggregate m3/ha stat only, not combined (D2 decision, TASK_00_FINDINGS.md)
  deadwood_vmi_zone: etela_suomi      # AOI's VMI reporting zone
  deadwood_vmi_m3_per_ha: 5.5         # Luke VMI2022 update, standing + lying dead wood, Etela-Suomi
  deadwood_vmi_standing_share: 0.3    # Luke: >70% is lying (maapuu); remainder standing (pystypuu)
  biodiversity_stumps_per_ha: 10
  ccf_peatland:                       # "lush drained spruce-dominated peatland" - the exact Plus prescription category
    peat_soiltype_min: 60             # Metsakeskus soiltype >=60 = peat/organic (same boundary as D3)
    fertility_class_max: 3            # <=3 = lehto..mustikkaturvekangas; the practical CCF-on-spruce-peat band (Tapio). Strict "reheva" alone would be <=2 - both reported
    drained_states: [7, 8, 9]         # ojikko / muuttuma / turvekangas - the drained-mire transformation stages (state 3 is drained *mineral*, irrelevant on peat)
    spruce_share_min: 0.5             # spruce-dominated, same convention as D3
  channel_network_resolution_m: 16    # coarser than D1's 2 m: full-AOI D-infinity at 2 m is ~850M cells,
                                       # the wrong engineering call for an illustrative buffer comparison;
                                       # 16 m matches MS-NFI's native grid, so channel buffers join MS-NFI
                                       # themes without a second resampling step. D1's 2 m catchment remains
                                       # the high-fidelity, validated demonstration.
  rusle:                               # DERIVE AND BENCHMARK vs Metsakeskus WCS "RUSLE-eroosiomalli" (2 m, t/ha/yr)
    benchmark_layer: RUSLE-eroosiomalli
    ls_exponent_m: 0.4                 # Moore & Burch (1986) unit-stream-power LS: A_s exponent
    ls_exponent_n: 1.3                 # slope exponent
    ls_specific_area_cap_m: 100.0      # cap on upslope area per contour width - LS is hillslope wash, not channel flow
    k_default: 0.025                   # K for unmapped / missing soiltype
    k_by_soiltype:                     # RUSLE K (SI, t ha h ha-1 MJ-1 mm-1): Panagos et al. 2014 ranges + Finnish context, keyed on Metsakeskus SoilTypeType
      10: 0.025                        # medium-coarse / coarse mineral
      11: 0.025                        # coarse till (moreeni)
      12: 0.013                        # coarse sorted - glaciofluvial sand & gravel, very permeable
      20: 0.043                        # fine-textured mineral - the erosion-prone class
      21: 0.043
      22: 0.043
      23: 0.043
      24: 0.043
      30: 0.020                        # stony mineral - surface partly armoured
      31: 0.020
      32: 0.020
      40: 0.043                        # stony fine-textured
      50: 0.005                        # bedrock / boulder field - negligible soil
      60: 0.015                        # peat - organic, high infiltration
      61: 0.015
      62: 0.015
      63: 0.015
      64: 0.030                        # Metsakeskus "eroosioherkka" (erosion-sensitive) peat
      65: 0.030
      66: 0.030
      67: 0.030
      70: 0.025                        # multamaa (mould)
      80: 0.025                        # liejumaa (gyttja)
    # r_factor, c_by_clc_class added as those factors are built (R -> C)

module_f_connectivity:
  node_sources: [protected_areas, habitat_s10, ymparistotuki, old_stands]
  old_stand_age_min_years: 120
  resistance_sensitivity_runs: 20     # sweep width for the "robust set" honesty requirement
